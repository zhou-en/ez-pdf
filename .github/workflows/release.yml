name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: '!matrix.use_cross'
        run: cargo build --release --target ${{ matrix.target }} -p ezpdf-cli

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p ezpdf-cli

      - name: Strip binary (Linux/macOS)
        run: strip target/${{ matrix.target }}/release/ezpdf || true

      - name: Package binary
        run: |
          BINARY=target/${{ matrix.target }}/release/ezpdf
          ARCHIVE=ezpdf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          tar czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  build-desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            squashfs-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned rather than `latest`: pnpm 11 requires Node >= 22.13 and dies on
      # older runtimes with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite. 9 matches
      # ezpdf-app/frontend/pnpm-lock.yaml, which is lockfileVersion 9.0.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install frontend dependencies
        working-directory: ezpdf-app/frontend
        run: pnpm install

      - name: Build desktop app
        working-directory: ezpdf-app
        run: ./frontend/node_modules/.bin/tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      # Uploaded separately so each artifact is flat. A single step with both
      # globs roots the artifact at their common ancestor (target/release/bundle),
      # which reintroduces the deb/ and appimage/ subdirectories that the release
      # job's artifacts/*.deb pattern cannot match.
      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-desktop-linux-deb
          path: target/release/bundle/deb/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-desktop-linux-appimage
          path: target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-desktop-linux-rpm
          path: target/release/bundle/rpm/*.rpm

  build-desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned rather than `latest`: pnpm 11 requires Node >= 22.13 and dies on
      # older runtimes with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite. 9 matches
      # ezpdf-app/frontend/pnpm-lock.yaml, which is lockfileVersion 9.0.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install frontend dependencies
        working-directory: ezpdf-app/frontend
        run: pnpm install

      # The .dmg produced here is unsigned and unnotarized, so Gatekeeper
      # blocks it on download (see README, "macOS: the app is not signed").
      # To sign, buy an Apple Developer account and add these repository
      # secrets, then uncomment the block below:
      #
      #   APPLE_CERTIFICATE          base64 of the .p12 Developer ID cert
      #   APPLE_CERTIFICATE_PASSWORD password used when exporting the .p12
      #   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID                   Apple account email, for notarytool
      #   APPLE_PASSWORD             app-specific password, NOT the account one
      #   APPLE_TEAM_ID              10-character team identifier
      #
      # Left commented rather than wired to empty secrets because an empty
      # APPLE_SIGNING_IDENTITY may be read as "sign with nothing" rather than
      # "skip signing", which would break a currently working release.
      #
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build desktop app
        working-directory: ezpdf-app
        run: ./frontend/node_modules/.bin/tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-desktop-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [build, build-desktop-linux, build-desktop-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
          generate_release_notes: true
