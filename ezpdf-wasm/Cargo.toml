[package]
name = "ezpdf-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for ezpdf-core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["markdown"]
markdown = ["ezpdf-core/markdown"]

[dependencies]
ezpdf-core = { path = "../ezpdf-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = { workspace = true }

# Cargo ignores [profile] outside the workspace root; wasm-pack drives wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
